	<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script>
    // ── Service Worker: register only, NO auto-update ──────────────────
    window._swReg = null;
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                window._swReg = reg;
                // Do NOT auto-call reg.update() or postMessage SKIP_WAITING
                // User must press the update button manually
            }).catch(err => {
                console.log('Service Worker registration failed:', err);
            });
        });
    }

    // ── Manual update checker ───────────────────────────────────────────
    // Compares CACHE_NAME in the live sw.js on GitHub with the currently
    // active SW.  If they differ, an update is available.
    const CURRENT_SW_URL = './sw.js';

    async function checkForUpdate() {
        const btn = document.getElementById('updateCheckBtn');
        if (btn) { btn.disabled = true; btn.textContent = '🔄 جارى الفحص...'; }

        try {
            // 1. Fetch the live sw.js (bypass cache)
            const res = await fetch(CURRENT_SW_URL + '?_=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) throw new Error('network');
            const text = await res.text();

            // 2. Extract CACHE_NAME from the fetched sw.js
            const remoteMatch = text.match(/const CACHE_NAME\s*=\s*['"]([^'"]+)['"]/);
            if (!remoteMatch) throw new Error('parse');
            const remoteCacheName = remoteMatch[1];

            // 3. Ask the active SW for its CACHE_NAME via MessageChannel
            let localCacheName = null;
            if (window._swReg && navigator.serviceWorker.controller) {
                localCacheName = await new Promise((resolve) => {
                    const mc = new MessageChannel();
                    const timer = setTimeout(() => resolve(null), 3000);
                    mc.port1.onmessage = (e) => {
                        clearTimeout(timer);
                        resolve(e.data && e.data.cacheName ? e.data.cacheName : null);
                    };
                    navigator.serviceWorker.controller.postMessage({ type: 'GET_CACHE_NAME' }, [mc.port2]);
                });
            }

            // 4. Compare
            if (localCacheName && remoteCacheName === localCacheName) {
                showUpdateToast('✅ التطبيق محدّث — لا توجد تحديثات جديدة', 'green', 4000);
                if (btn) { btn.disabled = false; btn.textContent = '🔔 تحقق من التحديثات'; }
                return;
            }

            // 5. Update available — ask user
            showUpdateToast('', 'none', 0, true, remoteCacheName);

        } catch (e) {
            showUpdateToast('⚠️ تعذّر الاتصال للتحقق من التحديثات', 'orange', 4000);
            if (btn) { btn.disabled = false; btn.textContent = '🔔 تحقق من التحديثات'; }
        }
    }

    async function applyUpdate() {
        // Dismiss confirm panel
        const panel = document.getElementById('updateConfirmPanel');
        if (panel) panel.remove();
        const btn = document.getElementById('updateCheckBtn');
        if (btn) { btn.disabled = true; }

        showUpdateToast('⏳ جارى التحديث... لا تغلق التطبيق', 'blue', 0);

        try {
            // Force SW to fetch new files
            if (window._swReg) await window._swReg.update();

            // Tell waiting SW to take over
            const reg = await navigator.serviceWorker.ready;
            if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });

            // Reload 3 times with short delays to fully flush caches
            let count = 0;
            const doReload = () => {
                count++;
                showUpdateToast('🔄 إعادة تحميل ' + count + ' / 3 ...', 'blue', 0);
                setTimeout(() => {
                    if (count < 3) {
                        window.location.reload(true);
                    } else {
                        window.location.reload(true);
                    }
                }, 1200);
            };

            // Listen for controller change (SW activated) then start reload chain
            let reloadCount = 0;
            const onController = () => {
                reloadCount++;
                showUpdateToast('🔄 إعادة تحميل ' + reloadCount + ' / 3 ...', 'blue', 0);
                if (reloadCount < 3) {
                    setTimeout(() => window.location.reload(true), 1000);
                } else {
                    setTimeout(() => {
                        navigator.serviceWorker.removeEventListener('controllerchange', onController);
                        showUpdateToast('✅ تم التحديث بنجاح!', 'green', 5000);
                        if (btn) { btn.disabled = false; btn.textContent = '🔔 تحقق من التحديثات'; }
                    }, 800);
                }
            };
            navigator.serviceWorker.addEventListener('controllerchange', onController);

            // Fallback: if no controllerchange fires in 4s, do manual reloads
            setTimeout(() => {
                navigator.serviceWorker.removeEventListener('controllerchange', onController);
                doReload();
            }, 4000);

        } catch(e) {
            showUpdateToast('❌ فشل التحديث. حاول مجدداً', 'red', 5000);
            if (btn) { btn.disabled = false; btn.textContent = '🔔 تحقق من التحديثات'; }
        }
    }

    function showUpdateToast(msg, color, duration, showConfirm, remoteName) {
        // Remove any existing update UI
        ['updateToastBar','updateConfirmPanel'].forEach(id => {
            const el = document.getElementById(id);
            if (el) el.remove();
        });
        if (!msg && !showConfirm) return;

        const colorMap = { green:'#1a8a4a', blue:'#1a6faf', orange:'#e8a020', red:'#c0392b', none:'' };
        const bg = colorMap[color] || '#1a6faf';

        if (showConfirm) {
            // Confirmation panel
            const panel = document.createElement('div');
            panel.id = 'updateConfirmPanel';
            panel.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);' +
                'background:#fff;border:2px solid #1a6faf;border-radius:14px;padding:18px 20px;' +
                'z-index:9999;box-shadow:0 4px 24px rgba(0,0,0,0.18);min-width:280px;max-width:340px;' +
                'text-align:center;direction:rtl;font-family:inherit;';
            panel.innerHTML =
                '<div style="font-size:22px;margin-bottom:6px;">🆕</div>' +
                '<div style="font-weight:700;color:#1a2533;margin-bottom:4px;">يوجد تحديث جديد</div>' +
                '<div style="font-size:12px;color:#5a6a7e;margin-bottom:14px;">' +
                    (remoteName ? 'الإصدار الجديد: <b>' + remoteName + '</b>' : '') +
                '</div>' +
                '<div style="display:flex;gap:10px;justify-content:center;">' +
                    '<button onclick="applyUpdate()" style="background:#1a6faf;color:#fff;border:none;' +
                        'border-radius:8px;padding:9px 20px;font-size:14px;font-family:inherit;cursor:pointer;font-weight:600;">' +
                        '✅ تحديث الآن</button>' +
                    '<button onclick="document.getElementById(\'updateConfirmPanel\').remove();' +
                        'document.getElementById(\'updateCheckBtn\').disabled=false;' +
                        'document.getElementById(\'updateCheckBtn\').textContent=\'🔔 تحقق من التحديثات\';" ' +
                        'style="background:#f0f4f8;color:#1a2533;border:1px solid #d4dde8;' +
                        'border-radius:8px;padding:9px 20px;font-size:14px;font-family:inherit;cursor:pointer;">' +
                        '⏭️ لاحقاً</button>' +
                '</div>';
            document.body.appendChild(panel);
            const btn = document.getElementById('updateCheckBtn');
            if (btn) { btn.disabled = false; btn.textContent = '🔔 تحقق من التحديثات'; }
            return;
        }

        const bar = document.createElement('div');
        bar.id = 'updateToastBar';
        bar.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);' +
            'background:' + bg + ';color:#fff;padding:11px 22px;border-radius:24px;' +
            'z-index:9999;font-size:14px;font-family:inherit;direction:rtl;' +
            'box-shadow:0 3px 16px rgba(0,0,0,0.22);white-space:nowrap;pointer-events:none;';
        bar.textContent = msg;
        document.body.appendChild(bar);
        if (duration > 0) setTimeout(() => { if (bar.parentNode) bar.remove(); }, duration);
    }
</script>
<title>إدارة متابعة المديريات</title>
<style>
/* Offline Arabic font stack - works without internet */
body { font-family: 'Segoe UI', 'Arial Unicode MS', 'Tahoma', 'Arial', sans-serif; }
</style>
<style>
    :root {
        --primary: #1a6faf;
        --primary-dark: #14578a;
        --primary-light: #e8f2fb;
        --primary-mid: #c6dff5;
        --accent: #e8a020;
        --accent-light: #fef3dc;
        --green: #1a8a4a;
        --green-light: #e3f5eb;
        --red: #c0392b;
        --red-light: #fdecea;
        --orange: #d35400;
        --orange-light: #fef0e7;
        --bg: #f0f4f8;
        --surface: #ffffff;
        --surface2: #f7f9fc;
        --border: #d4dde8;
        --border-light: #e8eef5;
        --text: #1a2533;
        --text-muted: #5a6a7e;
        --text-dim: #8a9ab0;
        --shadow-sm: 0 1px 4px rgba(26,111,175,0.08);
        --shadow: 0 2px 12px rgba(26,111,175,0.12);
        --shadow-lg: 0 4px 24px rgba(26,111,175,0.15);
        --radius: 12px;
        --radius-sm: 8px;
        --header-h: calc(60px + env(safe-area-inset-top, 0px));
        --safe-area-bottom: env(safe-area-inset-bottom, 0px);
        --mob-nav-h: calc(58px + var(--safe-area-bottom));
    }

/* Reset & Base */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  min-height: -webkit-fill-available;
}
body.menu-open {
  overflow: hidden;
}
body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  font-size: 14px;
}

.app-layout {
  min-height: -webkit-fill-available;
}

/* ========== HEADER ========== */
.app-header {
  position: fixed;
  top: 0;
  right: 0;
  left: 0;
  height: var(--header-h);
  background: var(--primary);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: env(safe-area-inset-top, 0px) 16px 0 16px;
  z-index: 200;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.header-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}

.header-logo .icon {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.header-titles {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header-titles .t1 {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.header-titles .t2 {
  font-size: 10px;
  color: rgba(255, 255, 255, 0.75);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: none;
}

@media (min-width: 600px) {
  .header-titles .t2 { display: block; }
}

.header-actions {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}

.hbtn {
  height: 34px;
  padding: 0 12px;
  border-radius: 7px;
  border: none;
  font-family: 'Cairo', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.15s;
  white-space: nowrap;
}

.hbtn-ghost { background: rgba(255, 255, 255, 0.15); color: #fff; }
.hbtn-ghost:hover, .hbtn-ghost:active { background: rgba(255, 255, 255, 0.25); }
.hbtn-white { background: #fff; color: var(--primary); }
.hbtn-white:hover, .hbtn-white:active { background: #e8f2fb; }
.hbtn-green { background: #27ae60; color: #fff; }
.hbtn-green:hover, .hbtn-green:active { background: #1e9050; }
.hbtn-accent { background: var(--accent); color: #fff; }
.hbtn-accent:hover, .hbtn-accent:active { background: #c8881a; }
.hbtn .icon-sm { font-size: 14px; }

@media (max-width: 599px) {
  .hbtn-desktop { display: none; }
}

/* ========== GLOBAL PROGRESS ========== */
.global-progress {
  position: fixed;
  top: var(--header-h);
  right: 0;
  left: 0;
  height: 4px;
  background: var(--primary-mid);
  z-index: 199;
}

.global-progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.4s;
}

/* ========== LAYOUT ========== */
.app-layout {
  position: fixed;
  top: calc(var(--header-h) + 4px);
  bottom: var(--mob-nav-h);
  right: 0;
  left: 0;
  display: flex;
}

@media (min-width: 768px) {
  .app-layout { bottom: 0; }
}

/* ========== SIDEBAR ========== */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transition: transform 0.25s ease-in-out;
}

.sidebar-inner {
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}

.sidebar-inner::-webkit-scrollbar { width: 4px; }
.sidebar-inner::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

@media (max-width: 360px) {
  .sidebar {
    width: 85%;
    max-width: 280px;
    min-width: 240px;
  }
}

.sidebar-head {
  padding: 12px 16px 8px;
  border-bottom: 1px solid var(--border-light);
  background: var(--primary-light);
  flex-shrink: 0;
}

.sidebar-head h3 {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.sidebar-total {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 6px;
  flex-wrap: wrap;
  gap: 6px;
}

.sidebar-total .score-big { font-size: 20px; font-weight: 900; color: var(--primary); }
.sidebar-total .score-max { font-size: 12px; color: var(--text-muted); }
.sidebar-total .pct-badge {
  font-size: 12px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 12px;
  background: var(--primary-light);
  color: var(--primary);
  white-space: nowrap;
}

/* Navigation Items */
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--border-light);
  transition: background 0.12s;
  position: relative;
  min-height: 44px;
}

.nav-item:hover { background: var(--primary-light); }
.nav-item.active {
  background: var(--primary-light);
  border-right: 3px solid var(--primary);
}

.nav-item .nav-icon {
  width: 30px;
  height: 30px;
  border-radius: 7px;
  background: var(--primary-light);
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.nav-item.active .nav-icon { background: var(--primary); color: #fff; }
.nav-item .nav-text { flex: 1; min-width: 0; }
.nav-item .nav-title { font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.3; }
.nav-item.active .nav-title { color: var(--primary); }
.nav-item .nav-sub { font-size: 10px; color: var(--text-dim); margin-top: 1px; }

.nav-pill {
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 10px;
  flex-shrink: 0;
}

.pill-done { background: var(--green-light); color: var(--green); }
.pill-partial { background: var(--orange-light); color: var(--orange); }
.pill-empty { background: var(--border-light); color: var(--text-dim); }

/* ========== MAIN CONTENT ========== */
.main-content {
  flex: 1;
  overflow-y: auto;
  background: var(--bg);
  padding: 16px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}

.main-content::-webkit-scrollbar { width: 6px; }
.main-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ========== HOME SCREEN ========== */
.home-screen { max-width: 900px; margin: 0 auto; }

.home-hero {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  border-radius: var(--radius);
  padding: 24px;
  color: #fff;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.home-hero .hero-icon { font-size: 40px; }
.home-hero h1 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
.home-hero p { font-size: 13px; opacity: 0.85; line-height: 1.6; }

/* Upload Card */
.upload-card {
  background: var(--surface);
  border: 2px dashed var(--primary-mid);
  border-radius: var(--radius);
  padding: 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  margin-bottom: 20px;
}

.upload-card:hover, .upload-card.drag-over {
  border-color: var(--primary);
  background: var(--primary-light);
}

.upload-card .up-icon { font-size: 32px; margin-bottom: 8px; }
.upload-card h3 { font-size: 15px; font-weight: 700; color: var(--primary); margin-bottom: 4px; }
.upload-card p { font-size: 12px; color: var(--text-muted); }
#fileInput { display: none; }

/* Meta Card */
.meta-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 20px;
}

.meta-card h2 {
  font-size: 14px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 499px) {
  .meta-grid { grid-template-columns: 1fr; }
}

.meta-field label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}

.meta-field input, .meta-field select {
  width: 100%;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  transition: border-color 0.15s;
}

.meta-field input:focus, .meta-field select:focus {
  outline: none;
  border-color: var(--primary);
  background: #fff;
}

.meta-field select option { background: #fff; }

/* Nav Grid */
.nav-grid-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.nav-card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-decoration: none;
  min-height: 44px;
}

.nav-card:hover, .nav-card:active {
  border-color: var(--primary);
  background: var(--primary-light);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}

.nav-card .nc-icon { font-size: 22px; }
.nav-card .nc-title { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.4; }
.nav-card .nc-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.nav-card .nc-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
.nc-fill-high { background: var(--green); }
.nc-fill-mid { background: var(--orange); }
.nc-fill-low { background: var(--red); }
.nc-fill-zero { background: var(--border); }
.nav-card .nc-score { font-size: 11px; color: var(--text-muted); }

/* ========== SECTION VIEW ========== */
.section-view { max-width: 900px; margin: 0 auto; }

.section-title-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}

.stb-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.stb-text { flex: 1; }
.stb-text h2 { font-size: 16px; font-weight: 800; color: var(--primary); }
.stb-text p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

.stb-score { text-align: center; flex-shrink: 0; }
.stb-score .big { font-size: 24px; font-weight: 900; color: var(--primary); }
.stb-score .small { font-size: 12px; color: var(--text-muted); }
.stb-score .pct {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 10px;
  margin-top: 3px;
}

/* Legend */
.legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 14px;
  font-size: 12px;
  color: var(--text-muted);
}

.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }
.dot-2 { background: var(--green); }
.dot-1 { background: var(--orange); }
.dot-0 { background: var(--red); }
.dot-na { background: var(--text-dim); }

/* Subsections */
.subsec-title {
  background: var(--primary-light);
  border: 1px solid var(--primary-mid);
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  padding: 8px 16px;
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  margin-top: 14px;
}

.subsec-body {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
}

/* Item Row */
.item-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 11px 14px;
  border-bottom: 1px solid var(--border-light);
  transition: background 0.12s;
}

.item-row:last-child { border-bottom: none; }
.item-row:hover { background: var(--surface2); }
.item-row.scored-2 { border-right: 6px solid var(--green); }
.item-row.scored-1 { border-right: 6px solid var(--orange); }
.item-row.scored-0 { border-right: 6px solid var(--red); }
.item-row.scored-na { border-right: 6px solid var(--text-dim); }

.item-num {
  min-width: 26px;
  height: 26px;
  background: var(--primary-light);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--primary);
  flex-shrink: 0;
  margin-top: 1px;
}

.item-text {
  flex: 1;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-wrap;
  min-width: 0;
}

.item-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  flex-wrap: wrap;
  justify-content: flex-start;
}

/* Score Buttons */
.sbtn, .sbtn-disabled {
  width: 38px;
  height: 34px;
  border: 2px solid var(--border);
  border-radius: 7px;
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.12s;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

.sbtn {
  background: var(--surface2);
  color: var(--text-muted);
  cursor: pointer;
}

.sbtn:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: var(--primary-light);
}

.sbtn:active { transform: scale(0.94); }

.sbtn.s0 { background: var(--red-light); border-color: var(--red); color: var(--red); }
.sbtn.s1 { background: var(--orange-light); border-color: var(--orange); color: var(--orange); }
.sbtn.s2 { background: var(--green-light); border-color: var(--green); color: var(--green); }
.sbtn.sna { background: var(--border-light); border-color: var(--text-dim); color: var(--text-dim); }

.sbtn-disabled {
  background: #2c2c2c;
  border-color: #333;
  color: #aaa;
  cursor: not-allowed;
  opacity: 0.6;
  pointer-events: none;
}

/* Note Button */
.nbtn {
  height: 34px;
  padding: 0 8px;
  border: 1.5px solid var(--border);
  border-radius: 7px;
  background: transparent;
  color: var(--text-muted);
  font-family: 'Cairo', sans-serif;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.12s;
  touch-action: manipulation;
  display: flex;
  align-items: center;
  gap: 3px;
}

.nbtn:hover, .nbtn:active { border-color: var(--accent); color: var(--accent); }
.nbtn.has-note { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* Note Area */
.note-area { padding: 0 14px 10px 14px; display: none; }
.note-area.open { display: block; }
.note-area textarea {
  width: 100%;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  font-size: 12px;
  resize: vertical;
  min-height: 60px;
}
.note-area textarea:focus { outline: none; border-color: var(--accent); }

/* ========== SUMMARY ========== */
.summary-view { max-width: 900px; margin: 0 auto; }

.total-card {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: var(--radius);
  padding: 20px 24px;
  color: #fff;
  margin-bottom: 20px;

  align-items: center;
  gap: 16px;

}

.total-card .tc-left { flex: 1; min-width: 160px; }
.total-card h2 { font-size: 16px; font-weight: 800; }
.total-card p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
.total-card .tc-right { text-align: center; }
.total-card .tc-score { font-size: 48px; font-weight: 900; line-height: 1; }
.total-card .tc-max { font-size: 14px; opacity: 0.75; margin-top: 4px; }
.total-card .tc-pct {
  font-size: 22px;
  font-weight: 800;
  margin-top: 8px;
  background: rgba(255, 255, 255, 0.2);

}

.sum-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}

.sum-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  transition: all 0.15s;
}

.sum-card:hover { border-color: var(--primary); box-shadow: var(--shadow); }
.sum-card-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.sum-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 8px; }
.sum-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s; }
.sum-scores { display: flex; align-items: center; justify-content: space-between; }
.sum-earned { font-size: 20px; font-weight: 900; color: var(--primary); }
.sum-max { font-size: 12px; color: var(--text-muted); }
.sum-pct { font-size: 13px; font-weight: 700; }

    /* ========== MOBILE BOTTOM NAV ========== */
    .mobile-nav {
        position: fixed;
        bottom: 0;
        right: 0;
        left: 0;
        height: var(--mob-nav-h);

}

  justify-content: center;

/* ========== SIDEBAR OVERLAY ========== */
.sidebar-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 140;
  opacity: 0;
  pointer-events: none;

}

.sidebar-overlay.show {

}

    /* ========== FIXED MOBILE LAYOUT ========== */
    @media (max-width: 767px) {
        .app-layout {
            position: fixed;
            top: var(--header-h);
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;

        }

            bottom: var(--mob-nav-h);

            width: 280px;
            z-index: 150;
            transform: translate3d(100%, 0, 0);
            transition: transform .28s cubic-bezier(.4, 0, .2, 1);

        }

            }
    }


/* ========== TOAST ========== */
.toast {

  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);

  border-radius: 24px;

@media (min-width: 768px) {

.pricing-btn:hover { background: var(--primary-dark); transform: scale(1.02); }
.pricing-card.featured .pricing-btn { background: var(--accent); }
.pricing-card.featured .pricing-btn:hover { background: #c8881a; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat-item { background: var(--surface2); padding: 12px; border-radius: var(--radius-sm); border-left: 4px solid var(--primary); }
.stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
.stat-value { font-size: 18px; font-weight: 800; color: var(--primary); margin-top: 4px; }

    <div id="installBanner" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#e8f2fb; padding:15px 16px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); border-top:2px solid #1a6faf; text-align:center; z-index:9999; box-shadow:0 -2px 12px rgba(0,0,0,0.15);">
        <p style="margin:0 0 10px 0; font-weight:bold; font-size:14px;">📲 ثبّت التطبيق على جهازك للعمل بدون إنترنت</p>

        <button id="btnCancel" style="background:transparent; color:#666; border:1px solid #ccc; padding:10px 16px; border-radius:8px; cursor:pointer; font-size:13px; margin-right:10px;">ليس الآن</button>
    </div>
    <!-- HEADER -->
    <header class="app-header">
        <div class="header-logo">
            <div class="icon">🏥</div>
            <div class="header-titles">
                <div class="t1">إدارة متابعة المديريات</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="hbtn hbtn-ghost hbtn-desktop" onclick="openUploadDialog()">
                <span class="icon-sm">📂</span> فتح ملف
            </button>
            <button class="hbtn hbtn-ghost hbtn-desktop" onclick="openMergeDialog()" title="دمج تقرير مفتش آخر">
                <span class="icon-sm">🔗</span> دمج تقرير
            </button>
            <button id="updateCheckBtn" class="hbtn hbtn-ghost" onclick="checkForUpdate()" title="تحقق من وجود تحديثات">
                <span class="icon-sm">🔔</span> <span class="hbtn-desktop">تحقق من التحديثات</span>
            </button>
            <button class="hbtn hbtn-accent" onclick="exportExcel()">
                <span class="icon-sm">📥</span> <span class="hbtn-desktop">Excel</span><span class="hbtn-mobile">تصدير</span>
            </button>
        </div>
    </header>
    <div class="sidebar-overlay"></div>

    <!-- PROGRESS BAR -->
    <div class="global-progress">
        <div class="global-progress-fill" id="gProgressFill" style="width:0%"></div>
    </div>

    <!-- SIDEBAR OVERLAY -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <!-- LAYOUT -->
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-head">
                <h3>أقسام النموذج</h3>
                <div class="sidebar-total">
                    <span class="score-big" id="sbTotalScore">0</span>
                    <span class="score-max" id="sbMaxScore">/ — نقطة</span>
                    <span class="pct-badge" id="sbTotalPct">0%</span>
                </div>
            </div>
            <div class="sidebar-inner" id="sidebarNav"></div>
        </nav>

        <!-- Main -->
        <main class="main-content" id="mainContent"></main>
    </div>

    <!-- MOBILE BOTTOM NAV -->
    <nav class="mobile-nav">
        <button class="mobile-nav-btn" id="mnHome" onclick="showHome()">
            <span class="mn-icon">🏠</span>
            <span class="mn-label">الرئيسية</span>
        </button>
        <button class="mobile-nav-btn" id="mnNav" onclick="toggleSidebar()">
            <span class="mn-icon">☰</span>
            <span class="mn-label">الأقسام</span>
        </button>
        <button class="mobile-nav-btn" id="mnSummary" onclick="showSection('summary')">
            <span class="mn-icon">📈</span>
            <span class="mn-label">الملخص</span>
        </button>
        <button class="mobile-nav-btn" id="mnReports" onclick="showReportsManager()">
            <span class="mn-icon">📁</span>
            <span class="mn-label">Database</span>
        </button>
        <button class="mobile-nav-btn" id="mnAnalysis" onclick="showAnalysis()">
            <span class="mn-icon">📊</span>
            <span class="mn-label">تحليل</span>
        </button>

    <div class="modal-bg" id="modalBg">
        <div class="modal">
            <h3 id="modalTitle"></h3>
            <p id="modalBody"></p>
            <div class="modal-btns">
                <button class="btn btn-danger" id="modalConfirm">تأكيد</button>
                <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- MERGE CONFLICT MODAL -->
    <div class="modal-bg" id="mergeModalBg" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center;padding:12px;">
        <div class="modal" style="max-width:620px;width:100%;max-height:90vh;display:flex;flex-direction:column;">
            <h3 id="mergeModalTitle"></h3>
            <p id="mergeModalBody" style="margin-bottom:8px;"></p>
            <div id="mergeConflictList" style="overflow-y:auto;flex:1;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;max-height:52vh;"></div>
            <div class="modal-btns" style="flex-shrink:0;">
                <button class="btn btn-primary"  id="mergeKeepBtn">إبقاء الحالي</button>
                <button class="btn btn-danger"   id="mergeOverwriteBtn">استبدال بالجديد</button>
                <button class="btn btn-ghost"    onclick="closeMergeModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

const DB_NAME = 'HospitalInspectionsDB';
const DB_VERSION = 2; // Incremented version for analysis feature
const STORE_NAME = 'inspection_reports';

// Open database connection
function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                // Create store with 'id' as auto-generated key
                const store = db.createObjectStore(STORE_NAME, { 
                    keyPath: 'id', 
                    autoIncrement: true 
                });
                // Create indexes for searching
                store.createIndex('hospitalName', 'hospitalName', { unique: false });
                store.createIndex('inspectionDate', 'inspectionDate', { unique: false });
                store.createIndex('savedAt', 'savedAt', { unique: false });
                store.createIndex('totalScore', 'totalScore', { unique: false });
                store.createIndex('governorate', 'governorate', { unique: false });
            }
        };
    });
}

// Save current inspection to database
async function saveToDatabase(recordName = null) {
    // Get current data
    const inspectionData = {
        // Metadata
        hospitalName: meta.hospitalName || '',
        governorate: meta.governorate || 'الاسكندرية',
        type: meta.type || '',
        inspectors: meta.inspectors || '',
        inspectionDate: meta.dates || '',
        
        // Scores and notes
        scores: { ...scores },
        notes: { ...notes },
        
        // Calculated totals
        totalEarned: 0,
        totalMax: 0,
        percentage: 0,
        
        // Timestamps
        savedAt: new Date().toISOString(),
        recordName: recordName || `${meta.hospitalName || 'تقرير'}_${meta.dates || new Date().toISOString().slice(0, 10)}`
    };
    
    // Calculate totals
    let grandEarned = 0, grandMax = 0;
    FORM_DATA.forEach(sec => {
        const { earned, effectiveMax } = getSectionScore(sec.key);
        grandEarned += earned;
        grandMax += effectiveMax;
    });
    inspectionData.totalEarned = grandEarned;
    inspectionData.totalMax = grandMax;
    inspectionData.percentage = grandMax > 0 ? Math.round(grandEarned / grandMax * 100) : 0;
    
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.add(inspectionData);
        
        request.onsuccess = () => {
            showToast('✓ تم حفظ التقرير في قاعدة البيانات');
            resolve(request.result);
        };
        request.onerror = () => reject(request.error);
        transaction.oncomplete = () => db.close();
    });
}

// Load inspection from database by ID
async function loadFromDatabase(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(id);
        
        request.onsuccess = () => {
            db.close();
            if (request.result) {
                // Restore data to current session
                const data = request.result;
                meta.hospitalName = data.hospitalName;
                meta.governorate = data.governorate;
                meta.type = data.type;
                meta.inspectors = data.inspectors;
                meta.dates = data.inspectionDate;
                scores = data.scores || {};
                notes = data.notes || {};
                
                updateMetaResult();
                buildSidebarNav();
                updateProgress();
                showHome();
                showToast(`✓ تم تحميل: ${data.recordName}`);
                resolve(data);
            } else {
                reject(new Error('السجل غير موجود'));
            }
        };
        request.onerror = () => reject(request.error);
    });
}

// Get all saved reports (with pagination)
async function getAllReports(limit = 50, offset = 0) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const index = store.index('savedAt');
        const reports = [];
        let count = 0;
        
        const request = index.openCursor(null, 'prev'); // newest first
        
        request.onsuccess = (event) => {
            const cursor = event.target.result;
            if (cursor && count < offset + limit) {
                if (count >= offset) {
                    reports.push({
                        id: cursor.value.id,
                        recordName: cursor.value.recordName,
                        hospitalName: cursor.value.hospitalName,
                        inspectionDate: cursor.value.inspectionDate,
                        totalEarned: cursor.value.totalEarned,
                        totalMax: cursor.value.totalMax,
                        percentage: cursor.value.percentage,
                        savedAt: cursor.value.savedAt,
                        governorate: cursor.value.governorate,
                        scores: cursor.value.scores || {}
                    });
                }
                count++;
                cursor.continue();
            } else {
                db.close();
                resolve(reports);
            }
        };
        request.onerror = () => reject(request.error);
    });
}
async function findDuplicateReport(hospitalName, inspectionDate) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const index = store.index('hospitalName');
        const request = index.getAll(hospitalName);
        request.onsuccess = () => {
            const matches = request.result.filter(r => r.inspectionDate === inspectionDate);
            db.close();
            resolve(matches.length > 0 ? matches[0] : null);
        };
        request.onerror = () => reject(request.error);
    });
}
// Delete report from database
async function deleteFromDatabase(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(id);
        
        request.onsuccess = () => {
            showToast('✓ تم حذف التقرير');
            resolve();
        };
        request.onerror = () => reject(request.error);
        transaction.oncomplete = () => db.close();
    });
}

// Search reports by criteria
async function searchReports(criteria) {
    const db = await openDB();
    const allReports = await getAllReports(1000, 0);
    db.close();
    
    return allReports.filter(report => {
        if (criteria.hospitalName && !report.hospitalName.includes(criteria.hospitalName)) return false;
        if (criteria.dateFrom && report.inspectionDate < criteria.dateFrom) return false;
        if (criteria.dateTo && report.inspectionDate > criteria.dateTo) return false;
        if (criteria.minPercentage && report.percentage < criteria.minPercentage) return false;
        return true;
    });
}

// Import Excel with conflict resolution
async function importExcelWithOptions(file, importMode = 'new') {
    // Mode: 'new' = add as new record, 'replace' = replace current, 'merge' = merge into current
    const buf = new Uint8Array(await file.arrayBuffer());
    const files = await zipRead(buf);
    const sheet = new TextDecoder().decode(files['xl/worksheets/sheet1.xml']);
    const ss_xml = new TextDecoder().decode(files['xl/sharedStrings.xml']);
    
    // Parse shared strings safely (indexOf, no backtracking)
    const ssItems = [];
    {
        const _o = '<si>', _c = '</si>';
        let _p = 0;
        while (true) {
            const _s = ss_xml.indexOf(_o, _p); if (_s === -1) break;
            const _e = ss_xml.indexOf(_c, _s + _o.length); if (_e === -1) break;
            const _inn = ss_xml.slice(_s + _o.length, _e);
            let _txt = '', _tp = 0;
            while (true) {
                const _ts = _inn.indexOf('<t', _tp); if (_ts === -1) break;
                const _te = _inn.indexOf('>', _ts); if (_te === -1) break;
                const _tc = _inn.indexOf('</t>', _te); if (_tc === -1) break;
                _txt += _inn.slice(_te + 1, _tc); _tp = _tc + 4;
            }
            ssItems.push(_txt.trim()); _p = _e + _c.length;
        }
    }

    // Read metadata from sheet2
    const sheet2_xml = new TextDecoder().decode(files['xl/worksheets/sheet2.xml']);
    const readSheetCell = (sheetXml, sharedStrings, cellRef) => {
        const _mk = 'r="' + cellRef + '"';
        const _i = sheetXml.indexOf(_mk); if (_i === -1) return '';
        const _cs = sheetXml.lastIndexOf('<c ', _i); if (_cs === -1) return '';
        const _te = sheetXml.indexOf('>', _cs);
        if (_te !== -1 && sheetXml[_te - 1] === '/') return ''; // self-closing = empty
        const _ce = sheetXml.indexOf('</c>', _cs); if (_ce === -1) return '';
        const _xml = sheetXml.slice(_cs, _ce + 4);
        const _tm = _xml.match(/\bt="([^"]*)"/);
        const _type = _tm ? _tm[1] : '';
        const _vs = _xml.indexOf('<v>'), _ve = _xml.indexOf('</v>');
        if (_vs === -1 || _ve === -1) return '';
        const _raw = _xml.slice(_vs + 3, _ve).trim();
        if (_type === 's') { const _si = parseInt(_raw); return (!isNaN(_si) && sharedStrings[_si] !== undefined) ? sharedStrings[_si] : ''; }
        return _raw;
    };
    
    const importedMeta = {
        dates: readSheetCell(sheet2_xml, ssItems, 'F1'),
        hospitalName: readSheetCell(sheet2_xml, ssItems, 'D2'),
        inspectors: readSheetCell(sheet2_xml, ssItems, 'F2'),
        type: readSheetCell(sheet2_xml, ssItems, 'D3')
    };
    
    // Read scores — row-index, no regex on full XML
    const importedScores = {};
    const importedNotes = {};
    const _rowIdx = {};
    { let _p = 0;
      while (true) {
        const _rs = sheet.indexOf('<row ', _p); if (_rs === -1) break;
        const _re = sheet.indexOf('</row>', _rs); if (_re === -1) break;
        const _rx = sheet.slice(_rs, _re + 6);
        const _rm = _rx.match(/\br="(\d+)"/);
        if (_rm) _rowIdx[parseInt(_rm[1])] = _rx;
        _p = _re + 6;
      }
    }
    const _readCell = (rowXml, col, rowNum) => {
        const _ref = col + rowNum;
        const _ci = rowXml.indexOf('r="' + _ref + '"'); if (_ci === -1) return null;
        const _cs = rowXml.lastIndexOf('<c ', _ci); if (_cs === -1) return null;
        const _te = rowXml.indexOf('>', _cs);
        if (_te !== -1 && rowXml[_te - 1] === '/') return null;
        const _ce = rowXml.indexOf('</c>', _cs); if (_ce === -1) return null;
        const _xml = rowXml.slice(_cs, _ce + 4);
        const _tm = _xml.match(/\bt="([^"]*)"/);
        const _type = _tm ? _tm[1] : '';
        const _vs = _xml.indexOf('<v>'), _ve = _xml.indexOf('</v>');
        if (_vs === -1 || _ve === -1) return null;
        const _raw = _xml.slice(_vs + 3, _ve).trim();
        if (_type === 's') { const _si = parseInt(_raw); return (!isNaN(_si) && ssItems[_si] !== undefined) ? ssItems[_si] : _raw; }
        return _raw;
    };
    FORM_DATA.forEach(sec => {
        let idx = 0;
        sec.subsections.forEach(sub => sub.items.forEach(() => {
            const mapKey = sec.key + '__' + idx;
            const exRow = ROW_MAP[mapKey];
            if (exRow) {
                const rowXml = _rowIdx[exRow];
                if (rowXml) {
                    const cVal = _readCell(rowXml, 'C', exRow);
                    if (cVal !== null) {
                        const v = cVal.trim();
                        if (v === 'N/A') importedScores[mapKey] = 'N/A';
                        else if (v === '0' || v === '0.0') importedScores[mapKey] = 0;
                        else if (v === '1' || v === '1.0') importedScores[mapKey] = 1;
                        else if (v === '2' || v === '2.0') importedScores[mapKey] = 2;
                    }
                    const dVal = _readCell(rowXml, 'D', exRow);
                    if (dVal && dVal.trim()) importedNotes[mapKey] = dVal.trim();
                }
            }
            idx++;
        }));
    });
    
    if (importMode === 'replace') {
        // Replace current session with imported data
        meta.hospitalName = importedMeta.hospitalName;
        meta.dates = importedMeta.dates;
        meta.inspectors = importedMeta.inspectors;
        meta.type = importedMeta.type;
        scores = importedScores;
        notes = importedNotes;
        updateMetaResult();
        saveToLocal();
        buildSidebarNav();
        updateProgress();
        showHome();
        // Ensure imported hospital name appears in dropdown
        if (meta.hospitalName) {
            const hnSel = document.getElementById('hospitalName');
            if (hnSel) {
                const exists = Array.from(hnSel.options).some(o => o.value === meta.hospitalName);
                if (!exists) { const opt = document.createElement('option'); opt.value = meta.hospitalName; opt.textContent = meta.hospitalName; hnSel.appendChild(opt); }
                hnSel.value = meta.hospitalName;
            }
        }
        showToast('✓ تم استبدال البيانات الحالية');
    } else if (importMode === 'merge') {
        // Merge: keep existing scores, only fill empty ones
        Object.keys(importedScores).forEach(k => {
            if (scores[k] === undefined) {
                scores[k] = importedScores[k];
            }
        });
        Object.keys(importedNotes).forEach(k => {
            if (!notes[k] && importedNotes[k]) {
                notes[k] = importedNotes[k];
            }
        });
        updateMetaResult();
        saveToLocal();
        buildSidebarNav();
        updateProgress();
        showHome();
        showToast('✓ تم دمج البيانات الجديدة');
    } else { // 'new' - save as new record
        // Save to database as new record
        const tempMeta = { ...meta };
        const tempScores = { ...scores };
        const tempNotes = { ...notes };
        
        meta.hospitalName = importedMeta.hospitalName;
        meta.dates = importedMeta.dates;
        meta.inspectors = importedMeta.inspectors;
        meta.type = importedMeta.type;
        scores = importedScores;
        notes = importedNotes;
        
        await saveToDatabase();
        
        // Restore original
        meta = tempMeta;
        scores = tempScores;
        notes = tempNotes;
        updateMetaResult();
        showToast('✓ تم استيراد التقرير كسجل جديد');
    }
    
    return { importedMeta, importedScores, importedNotes };
}

function getMonthName(month) {
    const names = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
    return names[month-1];
}
async function renderReportsList(filters = { hospitalName: '', year: '', month: '' }) {
    // Store the current filters globally (so we can reuse them after delete/export)
    currentReportFilters = filters;
    
    const allReports = await getAllReports();
    
    // ─── Extract unique values for dropdowns ───────────────────────────
    const hospitalsSet = new Set();
    const yearsSet = new Set();
    const monthsSet = new Set();
    
    allReports.forEach(report => {
        if (report.hospitalName && report.hospitalName.trim()) {
            hospitalsSet.add(report.hospitalName.trim());
        }
        const dateStr = report.inspectionDate;
        if (dateStr) {
            let year = null, month = null;
            // Try ISO format: YYYY-MM-DD
            const isoMatch = dateStr.match(/^(\d{4})-(\d{2})-\d{2}$/);
            if (isoMatch) {
                year = isoMatch[1];
                month = parseInt(isoMatch[2], 10);
            } else {
                // Try DD/MM/YYYY
                const dmyMatch = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
                if (dmyMatch) {
                    year = dmyMatch[3];
                    month = parseInt(dmyMatch[2], 10);
                } else {
                    // Fallback: try Date parsing
                    const d = new Date(dateStr);
                    if (!isNaN(d)) {
                        year = d.getFullYear();
                        month = d.getMonth() + 1;
                    }
                }
            }
            if (year) yearsSet.add(year);
            if (month) monthsSet.add(month);
        }
    });
    
    const hospitalsList = Array.from(hospitalsSet).sort();

            const dateStr = report.inspectionDate;
            if (!dateStr) return false;
            let year = null, month = null;
            const isoMatch = dateStr.match(/^(\d{4})-(\d{2})-\d{2}$/);
            if (isoMatch) {
                year = isoMatch[1];
                month = parseInt(isoMatch[2], 10);
            } else {
                const dmyMatch = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
                if (dmyMatch) {
                    year = dmyMatch[3];
                    month = parseInt(dmyMatch[2], 10);
                } else {
                    const d = new Date(dateStr);
                    if (!isNaN(d)) {
                        year = d.getFullYear();
                        month = d.getMonth() + 1;
                    }
                }
            }
            if (filters.year && year != filters.year) return false;
            if (filters.month && month != filters.month) return false;
        }
        return true;
    });
    
    // ─── Sort: by hospital name, then by date ascending ──────────────
    filteredReports.sort((a, b) => {
        const nameA = (a.hospitalName || '').trim();
        const nameB = (b.hospitalName || '').trim();
        if (nameA < nameB) return -1;
        if (nameA > nameB) return 1;
        // Same hospital — sort by date ascending (earlier first)
        const toDate = str => {
            if (!str) return 0;
            const iso = str.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (iso) return new Date(str).getTime();
            const dmy = str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (dmy) return new Date(`${dmy[3]}-${dmy[2].padStart(2,'0')}-${dmy[1].padStart(2,'0')}`).getTime();
            return new Date(str).getTime() || 0;
        };
        return toDate(a.inspectionDate) - toDate(b.inspectionDate);
    });

    if (allReports.length === 0) {

async function exportSingleReport(id) {
    const db = await openDB();
    const report = await new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(id);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
    });
    db.close();
    
    if (report) {
        // Temporarily swap current data with report data
        const tempMeta = { ...meta };
        const tempScores = { ...scores };
        const tempNotes = { ...notes };
        
        meta = { ...report };
        scores = report.scores || {};
        notes = report.notes || {};
        
        await exportExcel();
        
        // Restore
        meta = tempMeta;
        scores = tempScores;
        notes = tempNotes;
    }
}

async function saveCurrentToDatabase() {
    const hospitalName = meta.hospitalName || '';
    const inspectionDate = meta.dates || '';
    if (!hospitalName || !inspectionDate) {
        showToast('يرجى إدخال اسم المستشفى وتاريخ التقييم قبل الحفظ');
        return;
    }
    const existing = await findDuplicateReport(hospitalName, inspectionDate);
    if (existing) {
        const confirmUpdate = confirm(`يوجد تقرير سابق لنفس المستشفى والتاريخ (${existing.recordName}). هل تريد استبداله؟`);
        if (confirmUpdate) {
            await updateInDatabase(existing.id);
            showToast('✓ تم تحديث التقرير الموجود');
        } else {
            showToast('تم الإلغاء');
        }
    } else {
        const recordName = prompt('أدخل اسم للتقرير (اختياري):', `${hospitalName}_${inspectionDate}`);
        await saveToDatabase(recordName);
    }
    if (currentSection === 'reports') {
        renderReportsList(currentReportFilters);
    }
}

async function exportAllReports() {
    const reports = await getAllReports();
    if (reports.length === 0) {
        showToast('لا توجد تقارير للتصدير');
        return;
    }
    
    // Create a downloadable JSON export
    const exportData = {
        exportedAt: new Date().toISOString(),
        reportCount: reports.length,
        reports: reports,
        fullData: await Promise.all(reports.map(async (r) => {
            const db = await openDB();
            const full = await new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(r.id);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
            db.close();
            return full;
        }))
    };
    
    const jsonStr = JSON.stringify(exportData, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `all_reports_${new Date().toISOString().slice(0, 19)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`✓ تم تصدير ${reports.length} تقرير`);
}
// Import a JSON file containing one or more reports into IndexedDB
async function importDatabaseFromJSON() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json, .json';
    input.onchange = async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        
        try {
            showToast('⏳ جاري قراءة ملف JSON...');
            const text = await file.text();
            const data = JSON.parse(text);
            
            // Validate structure: must have fullData array
            if (!data.fullData || !Array.isArray(data.fullData) || data.fullData.length === 0) {
                showToast('⚠️ الملف لا يحتوي على تقارير صالحة (fullData مفقود أو فارغ)');
                return;
            }
            
            showToast(`⏳ جاري استيراد ${data.fullData.length} تقرير...`);
            
            let importedCount = 0;
            let skippedCount = 0;
            
            for (const report of data.fullData) {
                // Basic validation of each report
                if (!report.hospitalName && !report.totalEarned && !report.scores) {
                    skippedCount++;
                    continue;
                }
                
                // Remove the original id (if exists) to let IndexedDB auto‑generate a new one
                const { id, ...cleanReport } = report;
                
                // Ensure required fields exist
                const reportToSave = {
                    ...cleanReport,
                    savedAt: cleanReport.savedAt || new Date().toISOString(),
                    recordName: cleanReport.recordName || `${cleanReport.hospitalName || 'تقرير'}_${cleanReport.inspectionDate || 'تاريخ غير معروف'}`
                };
                
                // Add to database
                await addReportToDatabase(reportToSave);
                importedCount++;
                
                // Small yield to keep UI responsive
                if (importedCount % 5 === 0) {
                    await new Promise(r => setTimeout(r, 10));
                }
            }
            
            showToast(`✅ تم استيراد ${importedCount} تقرير${skippedCount ? `، تم تخطي ${skippedCount} تقرير غير صالح` : ''}`);
            
            // Refresh the reports list if we are currently viewing it
            if (currentSection === 'reports') {
                renderReportsList(currentReportFilters);
            }
        } catch (err) {
            console.error('Import error:', err);
            showToast('❌ خطأ في قراءة الملف: ' + err.message);
        } finally {
    input.remove();
    // Refresh the reports list if we are currently viewing it
    if (currentSection === 'reports') {
        renderReportsList(currentReportFilters);
    }
}
    };
    input.click();
}

// Helper: add a single report object to IndexedDB (auto‑increment id)
async function addReportToDatabase(reportData) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
        const transaction = db.transaction([STORE_NAME], 'readwrite');
        const store = transaction.objectStore(STORE_NAME);
        const request = store.add(reportData);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        transaction.oncomplete = () => db.close();
    });
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
    });
}

        function setScore(ik, val, secKey) {
    // Binary-only guard: block score 1
    const [secKeyFromIk, idxStr] = ik.split('__');
    const idx = parseInt(idxStr);
    const sec = FORM_DATA.find(s => s.key === secKeyFromIk);
    let item = null;
    let counter = 0;
    if (sec) {
        for (const sub of sec.subsections) {
            for (const it of sub.items) {
                if (counter === idx) { item = it; break; }
                counter++;
            }
            if (item) break;
        }
    }
    // Normal scoring
    scores[ik] = val;
    const row = document.getElementById(`irow-${ik}`);
    if (row) {
        // Fix: Properly manage classes
        row.classList.remove('scored-0', 'scored-1', 'scored-2', 'scored-na');
        if (val === 0) row.classList.add('scored-0');
        else if (val === 1) row.classList.add('scored-1');
        else if (val === 2) row.classList.add('scored-2');
        else if (val === 'N/A') row.classList.add('scored-na');
        
        // Update button styling
        const btns = row.querySelectorAll('.sbtn');
        btns.forEach((b) => {
            b.classList.remove('s0', 's1', 's2', 'sna');
            const btnText = b.textContent.trim();
            if (btnText === '0' && val === 0) b.classList.add('s0');
            else if (btnText === '1' && val === 1) b.classList.add('s1');
            else if (btnText === '2' && val === 2) b.classList.add('s2');
            else if (btnText === 'N/A' && val === 'N/A') b.classList.add('sna');
        });
    }
    updateSectionScoreDisplay(secKey);
    updateNavItem(secKey);
    updateProgress();
    updateMetaResult();
    debounceSave();
}

        async function loadTemplateFromCache(filename) {
            // Step 1: Get SW base path via MessageChannel (2s timeout)
            let base = '/hospital-form/';
            let swCacheName = null;
            if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                try {
                    const swData = await new Promise((resolve) => {
                        const mc = new MessageChannel();
                        const timer = setTimeout(() => resolve(null), 2000);
                        mc.port1.onmessage = (e) => { clearTimeout(timer); resolve(e.data || null); };
                        navigator.serviceWorker.controller.postMessage({ type: 'GET_CACHE_NAME' }, [mc.port2]);
                    });
                    if (swData && swData.base) base = swData.base;
                    if (swData && swData.cacheName) swCacheName = swData.cacheName;
                } catch (e) { /* SW unavailable */ }
            }

            // Step 2: Try SW cache directly (works fully offline)
            if (swCacheName && typeof caches !== 'undefined') {
                try {
                    const cache = await caches.open(swCacheName);
                    const candidates = [
                        location.origin + base + filename,
                        base + filename,
                        './' + filename,
                        filename
                    ];
                    for (const url of candidates) {
                        const resp = await cache.match(url);
                        if (resp) {
                            const buf = await resp.arrayBuffer();
                            if (buf.byteLength > 100) return new Uint8Array(buf);
                        }
                    }
                } catch (e) { /* fall through to network */ }
            }

            // Step 3: Network fetch — try force-cache first, then normal
            const fetchCandidates = [base + filename, './' + filename, filename];
            for (const cacheMode of ['force-cache', 'default']) {
                for (const url of fetchCandidates) {
                    try {
                        const resp = await fetch(url, { cache: cacheMode });
                        if (resp.ok) {
                            const buf = await resp.arrayBuffer();
                            if (buf.byteLength > 100) return new Uint8Array(buf);
                        }
                    } catch (e) { /* try next */ }
                }
            }

            throw new Error('تعذر تحميل القالب: ' + filename + '. تأكد من الاتصال بالإنترنت أو تحديث التطبيق.');
        }

        async function zipWrite(files) {
    const lhs = [], cds = [];
    let offset = 0;
    for (const [name, rawData] of Object.entries(files)) {
        const nb = new TextEncoder().encode(name);
        let comp = rawData, cm = 0;
        if (_canCompress) {
            try {
                const cs = new CompressionStream('deflate-raw');
                const writer = cs.writable.getWriter();
                const reader = cs.readable.getReader();
                const chunks = [];
                const pump = () => reader.read().then(({ done, value }) => {
                    if (done) return;
                    chunks.push(value);
                    return pump();
                });
                await writer.write(rawData);
                await writer.close();
                await pump();
                const c = new Uint8Array(chunks.reduce((a, b) => a + b.length, 0));
                let p = 0;
                for (const ch of chunks) {
                    c.set(ch, p);
                    p += ch.length;
                }
                if (c.length < rawData.length) {
                    comp = c;
                    cm = 8;
                }
            } catch(e) {
                comp = rawData;
                cm = 0;
            }
        }
        const crc = crc32(rawData);
        const lh = new Uint8Array([0x50, 0x4B, 0x03, 0x04, 0x14, 0x00, 0x00, 0x00, ...u16le(cm), 0x00, 0x00, 0x00, 0x00, ...u32le(crc), ...u32le(comp.length), ...u32le(rawData.length), ...u16le(nb.length), 0x00, 0x00, ...nb, ...comp]);
        const cd = new Uint8Array([0x50, 0x4B, 0x01, 0x02, 0x1E, 0x03, 0x14, 0x00, 0x00, 0x00, ...u16le(cm), 0x00, 0x00, 0x00, 0x00, ...u32le(crc), ...u32le(comp.length), ...u32le(rawData.length), ...u16le(nb.length), 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, ...u32le(offset), ...nb]);
        lhs.push(lh);
        cds.push(cd);
        offset += lh.length;
    }
    const cdOff = offset, cdSz = cds.reduce((a, b) => a + b.length, 0);
    const eocd = new Uint8Array([0x50, 0x4B, 0x05, 0x06, 0x00, 0x00, 0x00, 0x00, ...u16le(cds.length), ...u16le(cds.length), ...u32le(cdSz), ...u32le(cdOff), 0x00, 0x00]);
    const total = cdOff + cdSz + eocd.length, out = new Uint8Array(total);
    let pos = 0;
    for (const lh of lhs) { out.set(lh, pos); pos += lh.length; }
    for (const cd of cds) { out.set(cd, pos); pos += cd.length; }
    out.set(eocd, pos);
    return out;
}

        // Patch a single cell: preserve s= style attribute, update value
        function patchCell(sheet, cellRef, value) {
            const esc = v => String(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            const repl = (m, attrs) => {
                const a = attrs.replace(/\s*t="[^"]*"/g, '');
                if (value === null || value === '' || value === undefined) return '<c r="' + cellRef + '"' + a + '/>';
                if (typeof value === 'number') return '<c r="' + cellRef + '"' + a + '><v>' + value + '</v></c>';
                return '<c r="' + cellRef + '"' + a + ' t="str"><v>' + esc(value) + '</v></c>';
            };
            // Self-closing: <c r="I13" s="4"/>
            sheet = sheet.replace(new RegExp('<c r="' + cellRef + '"([^/]*)/>'), repl);
            // With content: <c r="I13" s="4" t="s"><v>...</v></c>
            sheet = sheet.replace(new RegExp('<c r="' + cellRef + '"([^>]*)>[\s\S]*?<\/c>'), repl);
            return sheet;
        }

        function readCellValue(sheet, cellRef) {
            const m = sheet.match(new RegExp('<c r="' + cellRef + '"[^>]*>[^<]*<v>([^<]*)<\/v>'));

        }

                const ss_xml = new TextDecoder().decode(files['xl/sharedStrings.xml']);

                // Parse shared strings safely
                const ssItems = [];
                {
                    const _o = '<si>', _c = '</si>';
                    let _p = 0;
                    while (true) {
                        const _s = ss_xml.indexOf(_o, _p); if (_s === -1) break;
                        const _e = ss_xml.indexOf(_c, _s + _o.length); if (_e === -1) break;
                        const _inn = ss_xml.slice(_s + _o.length, _e);
                        let _txt = '', _tp = 0;

                            const _tc = _inn.indexOf('</t>', _te); if (_tc === -1) break;
                            _txt += _inn.slice(_te + 1, _tc); _tp = _tc + 4;
                        }
                        ssItems.push(_txt.trim()); _p = _e + _c.length;
                    }
                }

                // Read all scores + notes from the incoming file
                const incomingScores = {};
                const incomingNotes  = {};

                FORM_DATA.forEach(sec => {
                    let idx = 0;
                    sec.subsections.forEach(sub => sub.items.forEach(() => {
                        const mapKey = sec.key + '__' + idx;
                        const exRow  = ROW_MAP[mapKey];
                        if (exRow) {
                            // Score (col C)
                            const cRe = new RegExp('<c\\s[^>]*r="C' + exRow + '"(?=[">/ ])[^>]*>(?:(?!<\/row>)[\\s\\S])*?<\/c>');
                            const cM  = sheet.match(cRe);
                            if (cM) {
                                const vM = cM[0].match(/<v>([^<]*)<\/v>/);
                                if (vM) {
                                    let val = vM[1].trim();
                                    if (/\bt="s"/.test(cM[0])) {
                                        const si = parseInt(val);
                                        if (!isNaN(si) && ssItems[si] !== undefined) val = ssItems[si];
                                    }
                                    if (val === 'N/A') incomingScores[mapKey] = 'N/A';

                // Build a label map: mapKey → {sectionTitle, questionText}
                const labelMap = {};
                FORM_DATA.forEach(sec => {
                    let idx = 0;
                    sec.subsections.forEach(sub => {
                        sub.items.forEach(item => {
                            labelMap[sec.key + '__' + idx] = {
                                section: sec.title,
                                text: item.text
                            };
                            idx++;
                        });
                    });
                });

                // Conflicts: question answered in BOTH reports
                const conflicts = Object.keys(incomingScores).filter(
                    k => scores[k] !== undefined && incomingScores[k] !== undefined
                );
                const newEntries = Object.keys(incomingScores).filter(
                    k => scores[k] === undefined

                // Build rich conflict details for display
                const conflictDetails = conflicts.map(k => ({
                    key:      k,
                    label:    labelMap[k] || { section: '', text: k },
                    current:  scores[k],
                    incoming: incomingScores[k]
                }));

                // Apply merge: overwriteConflicts=true → replace, false → keep current
                function applyMerge(overwriteConflicts) {
                    let merged = 0, skipped = 0;

                    Object.keys(incomingScores).forEach(k => {
                        if (scores[k] !== undefined && !overwriteConflicts) {
                            skipped++;
                        } else {
                            scores[k] = incomingScores[k];
                            merged++;
                        }
                    });

                    // Notes: append if both exist, otherwise just set
                    Object.keys(incomingNotes).forEach(k => {
                        if (notes[k] && incomingNotes[k] && notes[k] !== incomingNotes[k]) {
                            notes[k] = notes[k] + ' | ' + incomingNotes[k];
                        } else if (incomingNotes[k]) {
                            notes[k] = incomingNotes[k];
                        }
                    });

                    updateMetaResult();
                    saveToLocal();
                    buildSidebarNav();
                    updateProgress();
                    showHome();

                    const msg = overwriteConflicts
                        ? ('✓ تم الدمج: ' + merged + ' سؤال مُحدَّث، ' + skipped + ' تجاوزناه')
                        : ('✓ تم الدمج: ' + merged + ' سؤال جديد أُضيف، ' + skipped + ' تجاوزناه');
                    showToast(msg);
                }

                if (conflicts.length > 0) {
                    showMergeConflictModal(conflictDetails, newEntries.length, applyMerge);
                } else {
                    applyMerge(false);
                }

            } catch (e) {
                console.error(e);
                showToast('خطأ في قراءة الملف: ' + e.message);
            }
            event.target.value = '';
        }

        function showMergeConflictModal(conflictDetails, newCount, applyMerge) {
            const scoreLabel = v => v === 'N/A' ? 'N/A' : v === 0 ? '0 ✗' : v === 1 ? '1 ◑' : v === 2 ? '2 ✓' : '—';
            const scoreColor = v => v === 0 ? '#e74c3c' : v === 1 ? '#e67e22' : v === 2 ? '#27ae60' : '#999';

            document.getElementById('mergeConflictList').innerHTML = rows ||

function forceRecalculation(workbookXml) {
    if (workbookXml.includes('<calcPr')) {
        workbookXml = workbookXml.replace(/<calcPr[^>]*\/>/, '<calcPr calcId="1" fullCalcOnLoad="1"/>');
    } else {
        workbookXml = workbookXml.replace(/(<\/workbook>)/, '<calcPr calcId="1" fullCalcOnLoad="1"/>$1');
    }
    return workbookXml;
}

        function b64ToUint8Array(b64) {
            const bin = atob(b64);
            const arr = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
            return arr;
        }

        function xmlEsc(s) {
            return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&apos;');
        }

        function arabicDay(date) {
            const days = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            return days[date.getDay()];
        }

        function formatArabicDate(dateStr) {
            // dateStr could be like "3/5/2026" or "2026-05-03" or a free-form Arabic string
            // Try to parse as Date
            if (!dateStr) return '';
            // Try d/m/yyyy format first
            let d = null;
            const dmyMatch = dateStr.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
            if (dmyMatch) {
                d = new Date(parseInt(dmyMatch[3]), parseInt(dmyMatch[2]) - 1, parseInt(dmyMatch[1]));
            } else {
                // Try yyyy-mm-dd
                const isoMatch = dateStr.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
                if (isoMatch) {
                    d = new Date(parseInt(isoMatch[1]), parseInt(isoMatch[2]) - 1, parseInt(isoMatch[3]));
                }
            }
            if (!d || isNaN(d)) {
                // fallback: return original
                return dateStr;
            }
            const day = arabicDay(d);
            const dd = d.getDate();
            const mm = d.getMonth() + 1;
            const yyyy = d.getFullYear();
            return day + ' الموافق ' + dd + '/' + mm + '/' + yyyy;
        }

            // Build bullet paragraphs for negatives column
            let negParas = '';
            const textEntries = negativesNotes.filter(note => note !== null);
            if (textEntries.length === 0) {
                // No notes at all — empty cell
                negParas = `<w:p><w:pPr><w:bidi/></w:pPr></w:p>`;
            } else {
                negParas = textEntries.map(note => {
                    const clean = note.replace(/\r\n/g, ' ').replace(/\n/g, ' ').trim();

            return `<w:tr>
          <w:tc>

            </w:p>
          </w:tc>
          <w:tc>
            <w:tcPr><w:tcW w:w="6475" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>
            ${negParas}
          </w:tc>
          <w:tc>
            <w:tcPr><w:tcW w:w="916" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>
            <w:p>
              <w:pPr><w:bidi/><w:jc w:val="center"/><w:rPr><w:rFonts w:asciiTheme="majorBidi" w:hAnsiTheme="majorBidi" w:cstheme="majorBidi"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:rtl/><w:lang w:bidi="ar-EG"/></w:rPr></w:pPr>
