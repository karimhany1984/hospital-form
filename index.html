        async function doExportWord() {
            const selectedKeys = new Set(
                [...document.querySelectorAll('.wpck-cb:checked')].map(cb => cb.dataset.key)
            );
            if (selectedKeys.size === 0) { showToast('يرجى تحديد قسم واحد على الأقل'); return; }
            document.getElementById('wordPickerModal').remove();

            showToast('جاري إنشاء تقرير Word...');
            await new Promise(r => setTimeout(r, 50));
            try {
                const templateBuf = await loadWordTemplateHybrid();
                const files = await zipRead(templateBuf);
                let docXml = new TextDecoder('utf-8').decode(files['word/document.xml']);

                // Fix header: السلبيات → الملاحظات
                // The word is split across two runs: 'ال' + 'سلبيات' — merge them into one clean run
                docXml = docXml.replace(
                    /<w:t[^>]*>ال<\/w:t>(\s*<\/w:r>\s*<\/w:tc>|[\s\S]*?)<w:t[^>]*>سلبيات<\/w:t>/,
                    (m) => m.replace(/ال<\/w:t>/, 'الملاحظات</w:t>').replace(/<w:t[^>]*>سلبيات<\/w:t>/, '<w:t></w:t>')
                );
                // fallback single-run case
                docXml = docXml.replace(/<w:t[^>]*>السلبيات<\/w:t>/g, '<w:t>الملاحظات</w:t>');

                // Replace <<hospital name>>
                const hospitalName = meta.hospitalName || meta.hospital || '';
                docXml = docXml.replace(/&lt;&lt;hospital name&gt;&gt;/gi, xmlEsc(hospitalName));
                docXml = docXml.replace(/<<hospital name>>/gi, xmlEsc(hospitalName));

                // Replace <<Date>>
                const rawDate = meta.dates || '';
                const arabicDate = formatArabicDate(rawDate);
                docXml = docXml.replace(/&lt;&lt;Date&gt;&gt;/gi, xmlEsc(arabicDate));
                docXml = docXml.replace(/<<Date>>/gi, xmlEsc(arabicDate));

                // Build table rows for selected sections
                const tableRows = FORM_DATA
                    .filter(sec => selectedKeys.has(sec.key))
                    .map(sec => {
                        const { earned, effectiveMax } = getSectionScore(sec.key);
                        const pct = effectiveMax > 0 ? Math.round(earned / effectiveMax * 100) + '%' : '0%';

                        const notesList = [];
                        let idx = 0;
                        sec.subsections.forEach(sub => {
                            sub.items.forEach(item => {
                                const ik = `${sec.key}__${idx}`;
                                const sc = scores[ik];
                                const note = notes[ik];
                                // Include note if score 0 or 1 (any note state) OR score 2 with note
                                if ((sc === 0 || sc === 1) && note && note.trim()) {
                                    notesList.push(note.trim());
                                } else if (sc === 2 && note && note.trim()) {
                                    notesList.push(note.trim());
                                }
                                // sc 0/1 with no note → skip (no bullet)
                                idx++;
                            });
                        });

                        return buildWordTableRow(sec.title, notesList, pct);
                    }).join('\n');

                // Replace template's empty data row with generated rows
                const trMatches = [...docXml.matchAll(/<w:tr[ >][\s\S]*?<\/w:tr>/g)];
                if (trMatches.length >= 2) {
                    const secondTr = trMatches[1];
                    docXml = docXml.slice(0, secondTr.index) + tableRows + docXml.slice(secondTr.index + secondTr[0].length);
                }

                files['word/document.xml'] = new TextEncoder().encode(docXml);

                showToast('جاري حفظ الملف...');
                await new Promise(r => setTimeout(r, 30));
                const result = await zipWrite(files);

                const fname = `تقرير_${hospitalName || 'المستشفى'}_${rawDate || new Date().toLocaleDateString('ar-EG')}.docx`;
                const blob = new Blob([result], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
                const url2 = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url2; a.download = fname;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url2), 10000);
                showToast('✓ تم تصدير تقرير Word بنجاح');
            } catch(e) {
                console.error('doExportWord error:', e);
                showToastLong('❌ ' + (e.message || 'خطأ غير معروف في تصدير Word'));
            }
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            // try YYYY-MM-DD
            let m = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (m) return new Date(parseInt(m[1]), parseInt(m[2])-1, parseInt(m[3]));
            // try DD/MM/YYYY
            m = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (m) return new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
            // fallback
            const d = new Date(dateStr);
            return isNaN(d) ? null : d;
        }

    const gaugeArcLen = 94.2;   // π * r (r=30)

    const gaugeOffset = gaugeArcLen - gaugeFill;

    const best = count ? filtered.reduce((b,r)=> (r.percentage||0) > (b.percentage||0) ? r : b, filtered[0]) : null;
    const worst = count ? filtered.reduce((w,r)=> (r.percentage||0) < (w.percentage||0) ? r : w, filtered[0]) : null;

    // Trend over time (monthly)
    const trend = {};
    filtered.forEach(r => {

    });
    const trendLabels = Object.keys(trend).sort();

    const maxTrend = Math.max(...trendData, 0);

    // Hospitals performance table

        .map(([name, s]) => ({ name, avg: parseFloat((s.total/s.count).toFixed(1)), count: s.count }))

        async function exportAnalysisToExcel() {
            const allReports = await getAllReports();

                    if (currentAnalysisFilters.month && (d.getMonth()+1) != currentAnalysisFilters.month) return false;
                }
                return true;
            });
            let csvRows = [['اسم المستشفى', 'المحافظة', 'تاريخ التقييم', 'النسبة المئوية', 'النقاط المحققة', 'النقاط القصوى']];
            filtered.forEach(r => {
                csvRows.push([r.hospitalName, r.governorate, r.inspectionDate, r.percentage, r.totalEarned, r.totalMax]);
            });
            const csvContent = csvRows.map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');

            link.href = url;
            link.setAttribute('download', 'analysis_report.csv');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            showToast('✓ تم تصدير التحليل كملف CSV');

	// ═══════════════════════════════════════════════
    // SHARE TARGET RECEIVER
    // Handles Excel files shared from WhatsApp / system share sheet
    // ═══════════════════════════════════════════════

    // Convert base64 back to File object and feed into existing Excel importer
    function loadSharedExcelFile(name, base64) {
        try {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const blob = new Blob([bytes], {
                type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
            });
            const file = new File([blob], name || 'shared.xlsx', { type: blob.type });

            // Show a toast so the inspector knows the file arrived
            if (typeof showToast === 'function') showToast('📂 جاري تحميل الملف المشارك: ' + (name || ''));

            // Reuse the existing handleFileUpload function — simulate a file input event
            const fakeEvent = { target: { files: [file] } };
            if (typeof handleFileUpload === 'function') {
                handleFileUpload(fakeEvent);
            }
        } catch (err) {
            console.error('[Share] Failed to load shared file:', err);
            if (typeof showToast === 'function') showToast('خطأ في تحميل الملف المشارك');
        }
    }

    // 1. Listen for live postMessage from SW (app is already open in foreground)
    navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.type === 'SHARED_FILE') {
            loadSharedExcelFile(event.data.name, event.data.data);
        }
    });

    // 2. On startup: check if SW stored a shared file while the app was closed
    async function checkPendingSharedFile() {
        if (!('caches' in window) || !('serviceWorker' in navigator)) return;
        try {
            // Wait for an active SW — controller is null on first load after a redirect
            const reg = await navigator.serviceWorker.ready;
            const sw = reg.active;
            if (!sw) return;

            // Ask the SW which cache name it is currently using — no hardcoding needed
            const { cacheName, base } = await new Promise((resolve, reject) => {
                const mc = new MessageChannel();
                const timer = setTimeout(() => reject(new Error('GET_CACHE_NAME timeout')), 3000);
                mc.port1.onmessage = (e) => {
                    if (e.data && e.data.type === 'CACHE_NAME') {
                        clearTimeout(timer);
                        resolve({ cacheName: e.data.cacheName, base: e.data.base })
                    }
                };
                sw.postMessage({ type: 'GET_CACHE_NAME' }, [mc.port2]);
            });

            // Use absolute URL key — must match what sw.js stored
            const sharedFileKey = location.origin + base + 'shared-file';
            const cache = await caches.open(cacheName);
            const response = await cache.match(sharedFileKey);
            if (!response) return;
            const payload = await response.json();
            if (!payload || !payload.data) return;

            // Only process if fresh (within last 5 minutes)
            if (Date.now() - payload.timestamp > 5 * 60 * 1000) {
                await cache.delete(sharedFileKey);
                return;
            }

            // Clear it so it doesn't reload on next open
            await cache.delete(sharedFileKey);

            // Small delay to let the app UI fully initialise
            setTimeout(() => loadSharedExcelFile(payload.name, payload.data), 600);
        } catch (err) {
            console.error('[Share] checkPendingSharedFile error:', err);
        }
    }

    // Run the check once the SW is ready
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(() => checkPendingSharedFile());
    }
	function scrollToNextUnanswered() {
    const allRows = document.querySelectorAll('.item-row');
    let found = false;
    
    for (let row of allRows) {
        // Check if the row has any of the 'scored' classes indicating it's answered
        const isAnswered = row.classList.contains('scored-0') || 
                           row.classList.contains('scored-1') || 
                           row.classList.contains('scored-2') || 
                           row.classList.contains('scored-na');
        
        if (!isAnswered && !found) {
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            // Add temporary highlight
            row.style.transition = 'background-color 0.3s';
            row.style.backgroundColor = '#fff3cd';
            setTimeout(() => {
                row.style.backgroundColor = '';
            }, 2000);
            found = true;
            break;
        }
    }
    
    if (!found) {
        // Different message based on context
        if (currentSection === 'home' || currentSection === 'summary') {
            showToast('📋 انتقل إلى قسم ثم استخدم الزر مرة أخرى');
        } else {
            showToast('✓ جميع العناصر في هذا القسم مكتملة!');
        }
	}
}
